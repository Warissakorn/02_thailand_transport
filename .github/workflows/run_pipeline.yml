name: Run transport model pipeline

# INPUT -> PROCESS -> OUTPUT (ดู docs/PIPELINE_IO.md)
#   INPUT   : inputs/**            (แก้แล้ว push = รันใหม่อัตโนมัติ)
#   PROCESS : workflow นี้ เรียก scripts/** ในคอนเทนเนอร์ QGIS
#   OUTPUT  : สรุปในหน้า Actions + เว็บผลลัพธ์บน GitHub Pages + artifact
#
# ฟรีทั้งหมด: GitHub-hosted runner (public repo ไม่จำกัดนาที) และไม่มีบริการเสียเงิน
on:
  workflow_dispatch:
    inputs:
      stages:
        description: >
          ขอบเขตที่จะรัน: smoke (01+02 เช็คเร็ว), fetch (ดาวน์โหลดอย่างเดียว),
          network (fetch + เตรียมโครงข่าย/TAZ),
          calib (network + วางสถานี AADT — ใช้ไล่ปัญหา 07a/13 โดยไม่ต้องรอ 2 ชม.),
          full (ทั้งหมดจนถึงรายงาน)
        required: false
        default: full
        type: choice
        options: [smoke, fetch, network, calib, full]
      scenario:
        description: ชื่อ scenario ใน inputs/scenarios/<ชื่อ>.yaml
        required: false
        default: base
        type: string
  push:
    branches: [main]
    paths:
      - 'inputs/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/run_pipeline.yml'

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # สคริปต์ทุกตัวหา root จาก TT_ROOT ก่อน (ดู scripts/lib/paths.py)
  TT_ROOT: ${{ github.workspace }}
  TT_SCENARIO: ${{ inputs.scenario || 'base' }}
  STAGES: ${{ inputs.stages || 'full' }}
  # runner ไม่มีจอ — Qt ที่มากับ QGIS ต้องเรนเดอร์แบบ offscreen ไม่งั้น abort
  QT_QPA_PLATFORM: offscreen
  # ตั้ง repository variable ชื่อ GADM_URL ได้ถ้าต้นทาง GADM ล่มยาว
  # (Settings -> Secrets and variables -> Actions -> Variables) ดู docs/DATA_SOURCES.md
  TT_URL_GADM: ${{ vars.GADM_URL }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # image ทางการของ QGIS: มี PyQGIS (qgis.core/qgis.analysis/processing) + numpy/scipy/gdal
    # เทียบเท่าสภาพแวดล้อมที่ qpy.bat เตรียมให้บน Windows
    container:
      image: qgis/qgis:release-3_34
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          python3 --version
          python3 -c "import qgis.core; print('PyQGIS OK:', qgis.core.Qgis.QGIS_VERSION)"
          python3 -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          python3 -c "import sys; sys.path.insert(0,'scripts'); from lib import scenario as sc; print(sc.describe())"

      # ข้อมูลดาวน์โหลด (OSM ~1 GB + WorldPop) ไม่เปลี่ยนบ่อย -> cache ไว้ข้ามรอบ
      # ใช้ restore/save แยกกัน เพราะ actions/cache แบบรวมจะ save เฉพาะตอน job สำเร็จ
      # ที่ผ่านมา job ล้มที่ขั้นท้าย ๆ ทุกครั้ง cache จึงไม่เคยถูกบันทึกและต้องโหลดใหม่ทุกรอบ
      - name: Restore downloaded source data
        id: srccache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/boundaries
          key: srcdata-v1-
          restore-keys: srcdata-v1-

      # แยก gadm ออกมา: ต้นทาง geodata.ucdavis.edu ล่มเป็นช่วง ๆ ยาวหลายชั่วโมง
      # ถ้าโหลดไม่ได้ก็ยังเดินต่อได้ด้วยขอบเขตสำรองที่สกัดจาก OSM (ขั้น 02c)
      - name: 01 fetch data (osm, pop, aadt, targets)
        run: python3 scripts/01_fetch_data.py osm pop aadt target_freight target_pax target_intercity

      - name: 01 fetch data (gadm — ไม่บังคับ)
        run: |
          python3 scripts/01_fetch_data.py gadm \
            || echo "::warning::โหลด GADM ไม่ได้ — จะใช้ขอบเขตการปกครองสำรองจาก OSM (ขั้น 02c)"

      # if: always() — ถ้าแหล่งใดแหล่งหนึ่งล่ม ของที่โหลดสำเร็จแล้ว (OSM 311 MB, WorldPop)
      # ต้องไม่หายไปกับ job ที่ล้ม รอบถัดไปจะได้เหลือแค่แหล่งที่ยังขาด
      # คีย์ต่อ run: cache เก่าถูก restore ด้วย prefix แล้วบันทึกทับเป็นชุดที่ครบขึ้นเรื่อย ๆ
      - name: Save downloaded source data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/boundaries
          key: srcdata-v1-${{ github.run_id }}

      # 02a/02b คือขั้นที่เดิมทำด้วยมือนอกสคริปต์ (ogr2ogr + สร้าง TAZ ใน QGIS)
      # ผลลัพธ์ของทั้งคู่ถูก gitignore จึงต้องสร้างใหม่ทุกครั้งบนเครื่องเปล่า
      - name: 02 extract OSM roads + build TAZ + clean network
        if: env.STAGES != 'fetch'
        run: |
          python3 scripts/02a_extract_osm.py
          # 02c รันเฉพาะตอนไม่มี GADM (สกัด multipolygon จาก pbf 311 MB กินเวลาหลายนาที)
          [ -f data/boundaries/gadm41_THA.gpkg ] || python3 scripts/02c_boundaries_osm.py
          python3 scripts/02b_build_taz.py
          python3 scripts/02_prep_network_taz.py

      # ลำดับตามสายพึ่งพา: centroid -> โครงข่ายราง/น้ำ/อากาศ -> access connector
      - name: Multimodal networks (centroid -> rail/water/air/freight -> connectors)
        if: env.STAGES == 'full'
        run: |
          python3 scripts/build_popweighted_centroids.py
          python3 scripts/build_air_network.py
          python3 scripts/build_water.py
          python3 scripts/build_multimodal.py
          python3 scripts/build_water_freight.py
          python3 scripts/build_connectors.py

      - name: Province model (trip gen -> gravity -> mode choice)
        if: env.STAGES == 'full'
        run: |
          python3 scripts/03_trip_generation.py
          python3 scripts/04_od_cost.py
          python3 scripts/04b_gravity.py
          python3 scripts/05a_linehaul.py
          python3 scripts/05b_mode_choice.py

      # 07a ไม่ได้ใช้ผลจาก province model จึงลัดมาทดสอบตรงนี้ได้ใน ~10 นาที
      # (รอบ full ต้องรอ 2 ชม. กว่าจะรู้ว่า 07a/13 มีปัญหา)
      - name: AADT projection + geolocation (stage calib)
        if: env.STAGES == 'calib'
        run: |
          python3 scripts/build_aadt_projection.py
          python3 scripts/07a_geolocate_aadt.py

      - name: AADT projection + geolocation
        if: env.STAGES == 'full'
        run: |
          python3 scripts/build_aadt_projection.py
          python3 scripts/07a_geolocate_aadt.py

      # ด่านเร็ว (กราฟสุ่ม 300 node, ไม่กี่วินาที): ยืนยันว่า assignment แบบขนาน/serial
      # ให้ flow เท่ากับวิธีอ้างอิงที่วนทุก node — จับการแก้ที่ทำผลเพี้ยนก่อนเสียเวลาชั่วโมง
      - name: Assignment equivalence test
        if: env.STAGES == 'full'
        run: python3 scripts/_test_passign.py

      # ขั้นที่หนักที่สุด (กราฟ ~2.8M node) — พิมพ์ RAM และ exit code ให้ชัด
      # exit 137 = ถูก OOM kill (ไม่มี traceback) -> ลด run.dijkstra_batch / run.workers
      - name: District model (928 อำเภอ) + calibration + assignment
        if: env.STAGES == 'full'
        run: |
          echo "RAM ที่มี:"; free -m | head -2
          for s in 08a_district_prep 13_calibrate_params 14_final_assignment; do
            echo "--- $s ---"
            set +e
            python3 "scripts/$s.py" 2>&1 | tee -a output/_stage_district.log
            code=${PIPESTATUS[0]}
            set -e
            { echo "$s exit code: $code"; free -m | head -2; } | tee -a output/_stage_district.log
            if [ "$code" -ne 0 ]; then
              [ "$code" -eq 137 ] && echo "::error::$s ถูก kill เพราะหน่วยความจำไม่พอ (OOM)"
              exit "$code"
            fi
          done

      - name: Report outputs (tables + figures)
        if: env.STAGES == 'full'
        run: python3 scripts/15_report_outputs.py

      - name: Auxiliary layers + assemble .qgz
        if: env.STAGES == 'full'
        run: |
          python3 scripts/09a_mode_desire.py
          python3 scripts/09d_sequence_paths.py
          python3 scripts/10a_road_total_prov.py
          python3 scripts/10b_road_total_dist.py
          python3 scripts/11_road_components.py
          python3 scripts/build_project.py

      - name: Job summary
        if: always()
        run: python3 scripts/16_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Build results website
        if: always()
        run: python3 scripts/17_build_site.py

      # data/ และ model/ ใหญ่เกิน/สร้างใหม่ได้ จึงไม่ commit — เก็บเป็น artifact แทน
      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-outputs
          path: |
            model/
            output/report/
            output/_*.log
            thailand_transport.qgz
          retention-days: 7
          if-no-files-found: warn

      - name: Upload site artifact for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # วางไว้ท้ายสุดโดยตั้งใจ: log ของขั้นที่พังจะอยู่ท้ายไฟล์ log ของ job
      # หาได้ทันทีโดยไม่ต้องไล่อ่านทั้งหมด (สคริปต์เขียนรายละเอียดลง output/_*.log)
      # stage calib รันเพื่อดู log โดยเฉพาะ จึงดัมป์ให้เห็นแม้ job จะสำเร็จ
      - name: Script logs of the failing stage
        if: failure() || env.STAGES == 'calib'
        run: |
          if [ -f output/_geo.log ]; then
            echo "::group::output/_geo.log (ขั้น 07a)"; tail -n 25 output/_geo.log; echo "::endgroup::"
          fi
          echo "== log ที่ถูกแก้ไขล่าสุด (ขั้นที่กำลังทำงานตอนพัง) =="
          shopt -s nullglob
          logs=(output/_*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "(ยังไม่มีไฟล์ log — ขั้นที่พังน่าจะเป็น 01 fetch ซึ่งพิมพ์ลง stdout ด้านบน)"
            exit 0
          fi
          for f in $(ls -t "${logs[@]}" | head -3); do
            echo "::group::$f"; tail -n 40 "$f"; echo "::endgroup::"
          done

  # เผยแพร่หน้าเว็บผลลัพธ์ (ต้องเปิด Settings -> Pages -> Source: GitHub Actions ก่อน)
  deploy-pages:
    needs: pipeline
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
